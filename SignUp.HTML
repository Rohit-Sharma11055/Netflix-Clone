<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Netflix</title>
    <link rel="stylesheet" href="SignUp.CSS">
    <link rel="icon" href="Images/netflix.png"/>
    <link rel="icon" href="https://cdn4.iconfinder.com/data/icons/logos-and-brands/512/227_Netflix_logo-512.png">
    <style>
        body{
            background-image: url("Images/Sign_image.jpeg");
            background-size: cover;
        }
        header{
            height: 100px;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }
    </style>
</head>
<body>
    <div class="screen">
        <header>
        <div class="nav-bar">
            <div class="logo">
                    <img src="Images/net.png" alt="NETFLIX">
            </div>
            <div class="secondth">
                <div class="sign">
                    <a href="MAIN.HTML">Sign In</a>
                </div>
            </div>
        </div>
        </header>

        <div class="dialogue">
            <div class="first box">
                <h1>Unlimited movies, TV shows and more</h1>
            </div>
            <div class="second box">
                <h2>Watch anywhere. Cancel anytime.</h2>
            </div>
            <div class="third">
                <div>
                    <h3 class="data">Ready to watch? Enter your email to create or restart your membership.</h3>
                </div>
                <div class="email">
                    <input type="text" placeholder="Email address">
                    <a href="MAIN.HTML"><button>Get Started  > </button></a>
                </div>
        
            </div>
        </div>
    </div>
    
    <div class="break"></div>
    <div class="contact"></div>
</body>
</html>
